[project]
name = "legado-source-tools"
version = "0.2.0"
description = "Legado 书源管理工具：校验 / 归因 / AI 修复"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "orjson>=3.9", "beautifulsoup4>=4.12"]

[project.scripts]
legado = "cli.main:main"

[tool.setuptools]
packages = ["core", "core.rules", "core.repair", "services", "cli"]

[tool.setuptools.package-data]
"*" = ["*.json"]
